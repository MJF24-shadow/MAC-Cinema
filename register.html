<!DOCTYPE html>
<html lang="en">
    <head> <meta charset="utf-8">
        <title>Register | Account</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="styles.css" rel="stylesheet">
    </head>


    <body>
        <!-- HEADER AND NAVIGATIONAL BAR -->
        <header> <!-- start of header-->
            <div id="page-header">
                <h1>MAC Cinema</h1>
                <img src="images/CinemaLogo.PNG" alt="MAC Cinema Logo" class="header-image">

            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Main Menu</a></li>
                    <li><a href="#movies">Favorites</a></li>
                    <li><a href="#movies">Group Booking</a></li>
                    <li><a href="login.html">Account</a></li>
                
                </ul>
            </nav>
        </header> <!-- end of header-->

        <main>
            <form id="register-form" action="submission.html" method="post">
                <div class="account-form">
                    <h2>Register</h2>
                    <p>Fill up the form to create an account.</p>
                    
                    <!-- First Name Field -->
                    <div class="form-group">
                        <label for="first-name">First Name*</label>
                        <input type="text" placeholder="John" name="firstName" id="first-name" required>
                    </div>
                    
                    <!-- Last Name Field -->
                    <div class="form-group">
                        <label for="last-name">Last Name*</label>
                        <input type="text" placeholder="Smith" name="lastName" id="last-name" required>
                    </div>

                    <!-- Email Adress Field -->
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="text" placeholder="jsmith123@email.com" name="email" id="email" required>
                    </div>
                
                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">Password*</label>
                        <input type="password" placeholder="**********" name="password" id="password" required>
                    </div>
                    
                    <!-- Repeat Password Field -->
                    <div class="form-group">
                        <label for="psw-repeat">Repeat Password*</label>
                        <input type="password" placeholder="**********" name="psw-repeat" id="psw-repeat" required>
                    </div>
                    
                    
                    <div id="error-message"></div> <!--handles invalid user input-->
                    <div class="terms">
                         <p>By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>
                    </div>
                    <button type="submit" class="registerbtn">Sign Up</button>
                
                </div>
                
                <div class="signin">
                    <p>Already have an account? <a href="login.html">Sign In</a>.</p>
                </div>
            </form>
        </main>
    </body>
</html>
