<!DOCTYPE html>
<html lang="en">
    <head> <meta charset="UTF-8">
        <title>MAC Cinema</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="styles.css" rel="stylesheet">

        <script src="app.js" defer></script> <!-- loads external JavaScript file -->
    </head>

    <body>
        <!-- HEADER AND NAVIGATIONAL BAR -->
        <header> <!-- start of header-->
            <div id="page-header">
                <h1>MAC Cinema</h1>
                <img src="images/CinemaLogo.PNG" alt="MAC Cinema Logo" class="header-image">

            </div>
            <nav>
                <ul>
                    <li><a href="#movies">Movies</a></li>
                    <li><a href="#movies">Favorites</a></li>
                    <li><a href="#movies">Group Booking</a></li>
                    <li><a href="login.html">Account</a></li>
                
                </ul>
            </nav>
        </header> <!-- end of header-->
        
        <main> <!--start of main-->

            <!-- MOVIE POSTERS AND SHOWTIMES -->
            <section id="movies">
                <h2>Movies Now Showing</h2>
                <p>Click on a movie poster to view showtimes.</p>
                <div id="movies-theatres-grid"></div> <!--movie cards produced by JS-->
                
                <h2>Movies Coming Soon</h2>
                <div id="movies-soon-grid"></div> <!--movie cards produced by JS-->
            </section>
            

            <!-- SEAT SELECTION AND BOOKING FORM -->
            <section id="booking" hidden>
                <!--seat selection via interactive map-->
                <h2>Seat Selection</h2>
                <p id="selected-movie-info"></p>
                
                <div id="seat-map"></div>

                <!--booking form with previous showtime and seat data-->
                <h2>Booking Form</h2>
                <p>Complete your ticket booking</p>
                
                <form id="booking-form" action="submission.html" method="post">

                    <input type="hidden" id="movie-form" name="movieId">
                    <input type="hidden" id="showtime-form" name="showtimeId">


                    <div class="booking-summary">
                        <p>Seats: <span id="selected-seats">None</span></p>
                        <p>Total Price $<span id="total-price">0.00</span></p>
                    </div> <!--shows ticket booking summary with total price-->

                    <div class="form-group">
                        <label for="customer-name">Full Name</label>
                        <input type="text" id="customer-name" name="customerName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="customer-email">Email Address</label>
                        <input type="email" id="customer-email" name="customerEmail" required>
                    </div>

                    <div id="error-message"></div> <!--handles invalid user input-->
                    <button type="submit">Confirm booking</button>
                </form>



            </section>


            <section id="ai-assistance">

            </section>
           
            
            
        </main> <!--end of main-->
        
        <footer>Copyright 2026</footer>
      
    </body>
</html>
