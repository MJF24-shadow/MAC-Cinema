<!DOCTYPE html>
<html lang="en">
    <head> <meta charset="utf-8">
        <title>Login | Account</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>

    <body>
        <form id="login-form" action="submission.html" method="post">
            <div class="container">
                <h1>Login</h1>
                <p>Enter your login credentials to sign in.</p>
                <hr>
                <!-- Email Adress Field -->
                <div class="form-group">
                    <label for="email"><b>Email</b></label>
                    <input type="text" placeholder="jsmith123@email.com" name="email" id="email" required>
                </div>
                
                
                <!-- Password Field -->
                <div class="form-group">
                    <label for="password"><b>Password</b></label>
                    <input type="password" placeholder="**********" name="password" id="password" required>
                </div>
                <hr>
    
                <div id="error-message"></div> <!--handles invalid user input-->
                <button type="submit" class="registerbtn">Log In</button>
            </div>
            
            <div class="container signin">
                <p>Don't have an account <a href="register.html">Sign Up</a>.</p>
            </div>
        </form>

    </body>
</html>
