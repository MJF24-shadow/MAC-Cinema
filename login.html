<!DOCTYPE html>
<html lang="en">
    <head> <meta charset="utf-8">
        <title>Login | Account</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="styles.css" rel="stylesheet">
        <script src="auth.js" defer></script>
    </head>

    <body>
        <!-- HEADER AND NAVIGATIONAL BAR -->
        <header> <!-- start of header-->
            <div id="page-header">
                <h1>MAC Cinema</h1>
                <img src="images/CinemaLogo.PNG" alt="MAC Cinema Logo" class="header-image">

            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Main Menu</a></li>
                    <li><a href="#movies">Favorites</a></li>
                    <li><a href="#movies">Group Booking</a></li>
                    <li><a href="login.html">Account</a></li>
                
                </ul>
            </nav>
        </header> <!-- end of header-->

        <main>
            <form id="login-form" method="post" novalidate>
                <div class="account-form">
                    <h2>Login</h2>
                    <p>Enter your login credentials to sign in.</p>
                    
                    <!-- Email Adress Field -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" placeholder="jsmith123@email.com" name="email" id="email" required>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" placeholder="**********" name="password" id="password" required>
                    </div>
                    
                    <div id="error-message" class="error-banner" role="alert" hidden></div> <!--handles invalid user input-->
                    
                    <button type="submit" class="registerbtn">Log In</button>
                
                </div>
                
                <div class="signup">
                    <p>Don't have an account? <a href="register.html">Sign Up</a>.</p>
                </div>
            </form>

        </main>

    </body>
</html>
